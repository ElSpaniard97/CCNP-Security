name: Study site checks
# Runs on pull requests, and on main as the first job of the Pages deploy, so a change only goes
# live when these pass. (Actions are pinned to commit hashes; the comment names the version.)
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04  # Playwright 1.58 has no browser build for Ubuntu 26.04 yet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 tools/validate_tests.py
      - run: python3 tools/build_site_data.py --check
      - run: python3 -m unittest discover -s tests -p "test_*.py"
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: test-results
          path: test-results/
